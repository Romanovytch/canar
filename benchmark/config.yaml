# Benchmark configuration.
#
# `run`      — how the benchmark runs (dataset, judge, generation budget).
# `profiles` — the retrieval strategies to compare. Each profile mirrors the
#              fields of CanaR's RetrievalProfile (canar/app/retrieval), so the
#              same knobs the product exposes (top_k, score_threshold, ...) can
#              be swept here. The benchmark runs the dataset once per profile
#              and tags every result row with the profile name, so you can
#              compare strategies side by side.
#
# Env vars override the matching `run` keys: JUDGE_MODEL, GEN_MAX_TOKENS.

run:
  dataset: datasets/utilitr_questions.csv   # path relative to benchmark/
  agent: r_helpdesk
  limit: null                  # null = all 12 questions; set an int for a quick pass
  judge_model: qwen2.5:7b      # non-reasoning judge (fast, no timeouts); null = product LLM
  gen_max_tokens: 8192         # high, so the reasoning model finishes thinking AND answers

# Expected environment. The preflight checks canar/.env against these and aborts
# on a mismatch, so a result is only ever produced with the intended embedding
# model and collection — and results stay comparable across machines.
environment:
  embed_model: bge-m3
  collection: utilitr_v1

profiles:
  # Mirrors the product default (canar/app/retrieval/profiles.py) — measures
  # the product as it ships today.
  - name: product_default
    strategy: simple_vector
    top_k: 5
    score_threshold: 0.35
    source_filter: utilitr
    fallback_top_k: 3

  # Example experiment: retrieve more, prune less. Compare against the default.
  - name: wider_topk
    strategy: simple_vector
    top_k: 10
    score_threshold: 0.20
    source_filter: utilitr
    fallback_top_k: 3

  # Sparse retrieval (BM25 via FastEmbed). Uncomment to compare dense vs sparse.
  # Requires: FASTEMBED_SPARSE_MODEL set in canar/.env AND the collection
  # ingested with a compatible sparse vector (vector_name from the same .env).
  # - name: sparse_bm25
  #   strategy: simple_sparse
  #   top_k: 5
  #   score_threshold: 0.35
  #   source_filter: utilitr
  #   fallback_top_k: 3
