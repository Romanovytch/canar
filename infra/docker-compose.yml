services:
  postgres:
    image: postgres:16
    container_name: canar-postgres
    environment:
      POSTGRES_USER: canar
      POSTGRES_PASSWORD: canar
      POSTGRES_DB: canar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canar -d canar"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: canar-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  qdrantdata:
