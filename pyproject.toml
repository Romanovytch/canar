[project]
name = "canar"
version = "0.5.0"
requires-python = ">=3.10"
description = "Web chatbots using RAG"
readme = "README.md"

dependencies = [
  "streamlit>=1.35",
  "python-dotenv>=1.0.1",
  "fastembed>=0.8.0",
  "openai>=1.40.0",
  "qdrant-client>=1.10.0",
  "sqlmodel>=0.0.21",
  "pydantic>=2.7",
  "numpy>=1.26",
  "requests>=2.31",
  "psycopg[binary]>=3.1",
  "bcrypt>=4.1",
]

[project.scripts]
# Launch Streamlit app with: `canar`
canar = "canar.launch:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Package the launcher (`canar`)
include = ["canar*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
rerank = [
  "transformers>=4.51,<5.0",
  "accelerate>=0.34,<2.0",
  "safetensors>=0.4.5,<1.0",
]
# Benchmark dependencies (eval harness & resource monitoring including GPU).
# The rest of what the benchmark needs — qdrant-client, python-dotenv, fastembed — are already core deps above.
# Install with: pip install -e ".[benchmark]"
benchmark = [
  "ragas>=0.4.3",
  "langchain-openai>=0.2",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "langchain-community>=0.3.9,<0.4.2",
  "psutil>=5.9",              # optional resource benchmark (CPU/memory)
  "nvidia-ml-py>=12.0",       # GPU stats for the resource benchmark (device-level)
]
