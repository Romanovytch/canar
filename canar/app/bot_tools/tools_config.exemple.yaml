tool_providers:
  mcp:
    datagouv:
      url: "https://mcp.data.gouv.fr/mcp"
      transport: "streamable_http"
      timeout_seconds: 15
      read_timeout_seconds: 60
      headers: {}
      description: "Serveur MCP officiel de data.gouv.fr"

  local:
    local:
      description: "Fournisseur d'outils Python locaux (ex: web_search)"
